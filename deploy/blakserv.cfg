# Meridian: Shards server config (Linux, in the Docker image at /srv/blakserv).
# The Windows config is config/blakserv.cfg; keep the two in step.
# Only settings that differ from the blakserv defaults (blakserv/config.c) are listed.

[Path]
Bof                  loadkod/
Memmap               memmap/
Rsc                  rsc/
Rooms                rooms/
Motd                 ./
Channel              channel/
LoadSave             savegame/
Forms                ./
Kodbase              ./
PackageFile          ./

[Socket]
# 5960/9999 so Shards can run beside a Server 104 on 5959/9998
Port                 5960
MaintenancePort      9999
MaintenanceMask      127.0.0.1
Nagle                No

[Channel]
DebugDisk            Yes
ErrorDisk            Yes
LogDisk              Yes
Flush                Yes

[Console]
Caption              Meridian: Shards

[Constants]
Enabled              Yes
Filename             ./blakston.khd

[Auto]
SavePeriod           30
