# Meridian: Shards server config (Windows run).
# Source of truth for run\shards\blakserv.cfg; tools\setup-run.cmd copies it there.
# blakserv runs with run\shards as its working directory, and reads the build output
# (loadkod, rsc) from upstream's run\server, so a rebuild needs no copying.
# Only settings that differ from the blakserv defaults (blakserv/config.c) are listed.
# The Linux config is deploy/blakserv.cfg.

[Path]
Bof                  ..\server\loadkod\
Memmap               memmap\
Rsc                  ..\server\rsc\
Rooms                ..\..\resource\rooms\
Motd                 .\
Channel              channel\
LoadSave             savegame\
Forms                .\
Kodbase              ..\..\kod
PackageFile          .\

[Socket]
# 5960/9999 so Shards can run beside a Server 104 on 5959/9998
Port                 5960
MaintenancePort      9999
MaintenanceMask      127.0.0.1
Nagle                No

[Channel]
DebugDisk            Yes
ErrorDisk            Yes
LogDisk              Yes
Flush                Yes

[Console]
Caption              Meridian: Shards (local)

[Constants]
Enabled              Yes
Filename             ..\..\kod\include\blakston.khd

[Auto]
SavePeriod           30
